apiVersion: apps/v1
kind: Deployment
metadata:
  name: campuskart-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campuskart-frontend
  template:
    metadata:
      labels:
        app: campuskart-frontend
    spec:
      containers:
      - name: frontend
        image: campuskart-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: campuskart-frontend-service
spec:
  type: NodePort
  selector:
    app: campuskart-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30001
