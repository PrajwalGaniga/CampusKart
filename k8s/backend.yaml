apiVersion: apps/v1
kind: Deployment
metadata:
  name: campuskart-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campuskart-backend
  template:
    metadata:
      labels:
        app: campuskart-backend
    spec:
      containers:
      - name: backend
        image: campuskart-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: MONGO_URL
          value: "mongodb://admin:password@mongodb-service:27017"
        - name: MONGO_DB_NAME
          value: "campuskart"
        - name: SECRET_KEY
          value: "your_super_secret_key_here"
---
apiVersion: v1
kind: Service
metadata:
  name: campuskart-backend-service
spec:
  type: NodePort
  selector:
    app: campuskart-backend
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30000
