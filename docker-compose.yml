version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: campus_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: campus_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=campus_askboard
      - JWT_SECRET=super-secret-campus-askboard-jwt-key-2026
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: campus_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
